# Refreshes backdrops.json with this week's trending movies and shows from TMDB, once a day.
# Needs the repository secret TMDB_TOKEN (TMDB "API Read Access Token"). Only image paths and
# titles are saved; the token never reaches the page.
name: Refresh backdrops

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch trending backdrops
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        shell: bash
        run: |
          # Works with either TMDB credential: the long API Read Access Token
          # (sent as a Bearer header) or the 32-character API Key (sent as api_key).
          key="$(printf '%s' "$TMDB_TOKEN" | tr -d '[:space:]')"
          key="${key#Bearer}"
          url="https://api.themoviedb.org/3/trending/all/week?language=en-US"
          if [[ "$key" =~ ^[0-9a-fA-F]{32}$ ]]; then
            code=$(curl -sS -o trending.json -w '%{http_code}' "$url&api_key=$key")
          else
            code=$(curl -sS -o trending.json -w '%{http_code}' -H "Authorization: Bearer $key" "$url")
          fi
          if [ "$code" != "200" ]; then
            echo "::error::TMDB answered $code: $(jq -r '.status_message // empty' trending.json 2>/dev/null)"
            echo "Check the TMDB_TOKEN secret (TMDB > Settings > API: API Read Access Token or API Key)."
            exit 1
          fi
          jq '[.results[] | select(.backdrop_path != null and (.adult // false | not))
               | {path: .backdrop_path, title: (.title // .name)}] | .[0:20]' trending.json > backdrops.json
          rm trending.json
          test "$(jq length backdrops.json)" -gt 0

      - name: Commit and rebuild the site if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backdrops.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh trending backdrops"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
